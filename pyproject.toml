[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-box-auto-open-analysis"
version = "0.1.0"
description = "A/B analysis pipeline for the Chat-box-auto-open experiment."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["Chat-box-auto-open"]
include = ["analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Chat-box-auto-open"]
addopts = "-ra"
